<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO SYSTEM | THE VOID</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #121212;
            --accent: #00f3ff; --text: #e0e0e0;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Courier New', monospace; margin: 0;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }
        /* Эффект сканирующей линии */
        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 243, 255, 0.1); animation: scan 6s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .status { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }

        main { flex: 1; padding: 20px; overflow-y: auto; }
        .card { 
            background: var(--surface); border-left: 3px solid var(--accent);
            padding: 15px; margin-bottom: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .label { font-size: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 5px; display: block; }

        .input-box { padding: 20px; background: var(--surface); border-top: 1px solid #222; }
        input { 
            width: 100%; background: transparent; border: 1px solid #333; 
            padding: 12px; color: var(--accent); outline: none;
        }
    </style>
</head>
<body>
    <header>
        <div>MONO // CORE</div>
        <div class="status">● System: Online</div>
    </header>
    <main>
        <div class="card">
            <span class="label">System Message</span>
            <div>Welcome to THE VOID, wtzzdx. Initializing neural interface...</div>
        </div>
        <div id="output"></div>
    </main>
    <div class="input-box">
        <input type="text" placeholder="Введите команду...">
    </div>
</body>
</html>
